<?xml version="1.0" encoding="UTF-8"?>
<!-- SUCCO plugin logo - original artwork, dark purple theme -->
<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a0d3a"/>
      <stop offset="100%" stop-color="#1a0d24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0a3ff"/>
      <stop offset="100%" stop-color="#b975ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background panel -->
  <rect x="0" y="0" width="400" height="120" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="398" height="118" rx="11" fill="none" stroke="#6b3da3" stroke-width="1.5"/>

  <!-- Glow under text -->
  <ellipse cx="200" cy="55" rx="120" ry="22" fill="#b975ff" opacity="0.18" filter="url(#glow)"/>

  <!-- SUCCO text -->
  <text x="200" y="68" text-anchor="middle"
        font-family="Verdana, sans-serif" font-size="42" font-weight="bold"
        fill="url(#accent)" letter-spacing="4"
        filter="url(#glow)">SUCCO</text>

  <!-- Subtitle -->
  <text x="200" y="100" text-anchor="middle"
        font-family="Verdana, sans-serif" font-size="11"
        fill="#9b85b8" letter-spacing="3">VOCAL CHAIN</text>

  <!-- Side accent dots -->
  <circle cx="30" cy="60" r="3" fill="#b975ff"/>
  <circle cx="370" cy="60" r="3" fill="#b975ff"/>
</svg>
